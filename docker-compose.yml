services:
  mysql:
    image: mysql:8.0
    container_name: ocj_mysql
    restart: always
    ports:
      - "3307:3306"
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    environment:
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocj_redis
    restart: always
    ports:
      - "6379:6379"
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ocj_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:6868/api/v1
      VITE_SOCKET_URL: http://localhost:6868
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      main-service:
        condition: service_started

  main-service:
    build:
      context: .
      dockerfile: apps/main-service/Dockerfile
    container_name: ocj_main_service
    restart: always
    ports:
      - "6868:6868"
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: ocj_worker_service
    restart: always
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    depends_on:
      redis:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
