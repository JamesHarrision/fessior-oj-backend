version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ocj_mysql
    restart: always
    ports:
      - "3307:3306"
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: ocj_mongodb
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - .env.docker
    command: mongod --auth
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ocj_redis
    restart: always
    ports:
      - "6379:6379"
    env_file:
      - .env.docker
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  mongo_data:
  redis_data:
